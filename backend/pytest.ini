[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    error
    # Aviso de anyio al importar starlette.testclient con estas versiones; no es de DataTab
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # Starlette 1.9 prefiere httpx2 para su cliente de pruebas; httpx sigue funcionando
    ignore:Using .httpx. with .starlette.testclient. is deprecated
markers =
    lento: pruebas con archivos de ~5 MB (se pueden saltar con -m "not lento")
